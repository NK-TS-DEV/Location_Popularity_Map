<!doctype html>
<html>
<body style="margin:0;padding:24px;background:#f4f6f8;font-family:Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;padding:32px;">
          <tr>
            <td>
              <h2 style="margin:0 0 16px;color:#111111;">{{ title }}</h2>
              <p style="color:#444444;font-size:15px;line-height:1.5;">Hi {{ username }},</p>
              <p style="color:#444444;font-size:15px;line-height:1.5;">{{ intro }}</p>
              <p style="text-align:center;margin:28px 0;">
                <a href="{{ link }}" style="background:#2563eb;color:#ffffff;text-decoration:none;padding:14px 28px;border-radius:8px;font-weight:bold;display:inline-block;">{{ button_text }}</a>
              </p>
              <p style="color:#888888;font-size:12px;line-height:1.5;">If the button doesn't work, copy this link into your browser:<br>{{ link }}</p>
              <p style="color:#888888;font-size:12px;">If you didn't request this, just ignore this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
